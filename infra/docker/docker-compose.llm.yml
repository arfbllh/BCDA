# Optional Ollama for local OpenAI-compatible inference (/v1/chat/completions).
# From repo root:
#   docker compose -f infra/docker/docker-compose.llm.yml up -d
# Pull a model (example):
#   docker exec -it bcancerportal-ollama ollama pull llama3.2
# Backend env:
#   LLM_INFERENCE_ENABLED=true
#   LLM_API_BASE_URL=http://localhost:11434/v1
#   LLM_MODEL=llama3.2

services:
  ollama:
    image: ollama/ollama:latest
    container_name: bcancerportal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
