groups:
  - name: bcancerportal-platform-alerts
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(http_request_errors_total[5m])) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate is high"
          description: "http_request_errors_total has exceeded 1 error/sec for 5 minutes."
          runbook: "doc/runbook.md#incident-4-high-api-error-rate"

      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is elevated"
          description: "p95 latency has remained above 1.5 seconds for 10 minutes."
          runbook: "doc/runbook.md#incident-3-api-latency-spike"

      - alert: ApiNotReady
        expr: up{job="bcancerportal-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API target is down"
          description: "Prometheus cannot scrape the bcancerportal API target."
          runbook: "doc/runbook.md#incident-4-high-api-error-rate"
